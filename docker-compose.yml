services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: upa_user
      POSTGRES_PASSWORD: upa_password
      POSTGRES_DB: upa_nordeste
    ports:
      - "5432:5432"
    volumes:
      - upa_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U upa_user -d upa_nordeste"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    env_file:
      - backend/.env
    environment:
      DATABASE_URL: postgresql+psycopg://upa_user:upa_password@postgres:5432/upa_nordeste
      WATCHFILES_FORCE_POLLING: "true"
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build: ./frontend
    env_file:
      - frontend/.env
    volumes:
      - ./frontend:/app
      - frontend-node-modules:/app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  upa_postgres_data:
  frontend-node-modules:
